name: PR Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-quality:
    name: PR Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Reject alternate lockfiles
        run: |
          for f in package-lock.json yarn.lock bun.lockb; do
            if [ -e "$f" ]; then
              echo "Forbidden lockfile present: $f"
              exit 1
            fi
          done

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # bb plugin build requires the desktop BB AppImage and does not complete
      # reliably on GitHub-hosted runners; W1a validates build locally (see README).
